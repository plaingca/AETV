[project]
name = "aetv"
version = "0.1.1"
description = "Live learned video over challenging amateur-radio channels"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AETV contributors" }]
keywords = ["amateur-radio", "hf", "ofdm", "video", "jscc"]
classifiers = [
    "License :: OSI Approved :: Artistic License",
    "Topic :: Communications :: Ham Radio",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
ham = [
    "sounddevice>=0.4.6",
    "opencv-python>=4.8",
]
gui = [
    "sounddevice>=0.4.6",
    "opencv-python>=4.8",
    "pyside6>=6.6",
    "websockets>=12.0",
    "pyserial>=3.5",
    "onnxruntime>=1.20,<1.24",
]
train = [
    "torch>=2.2",
    "torchvision>=0.17",
    "onnx>=1.17",
    "huggingface-hub>=0.30",
    "lpips>=0.1.4",
    "datasets>=2.18",
    "pylance>=10,<11",
    "tensorboard>=2.14",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
aetv = "aetv.cli:main"
aetv-gui = "aetv.gui.app:main"

[project.urls]
Homepage = "https://github.com/plaingca/AETV"
Documentation = "https://github.com/plaingca/AETV#readme"
Issues = "https://github.com/plaingca/AETV/issues"
Source = "https://github.com/plaingca/AETV"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aetv"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/train.py" = "aetv/_scripts/train.py"
"scripts/eval.py" = "aetv/_scripts/eval.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
