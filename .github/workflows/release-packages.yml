name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux CPU
            os: ubuntu-latest
            artifact: aetv-linux-x64-cpu
            output: dist/linux-cpu/AETV-linux-x64-cpu.tar.gz
            command: ./scripts/build_linux.sh
          - name: Windows CPU
            os: windows-latest
            artifact: aetv-windows-x64-cpu
            output: dist/windows-cpu/AETV-windows-x64-cpu.zip
            command: ./scripts/build_windows.ps1 -Runtime cpu
          - name: Windows CUDA
            os: windows-latest
            artifact: aetv-windows-x64-cuda
            output: dist/windows-cuda/AETV-windows-x64-cuda.zip
            command: ./scripts/build_windows.ps1 -Runtime cuda

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Linux GUI runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Build and smoke-test portable package
        shell: pwsh
        if: runner.os == 'Windows'
        run: ${{ matrix.command }}

      - name: Build and smoke-test portable package
        shell: bash
        if: runner.os == 'Linux'
        run: ${{ matrix.command }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          cuda_zip="$(find release-assets -type f -name '*windows-x64-cuda.zip' -print -quit)"
          if [[ -n "$cuda_zip" ]] && (( $(stat -c %s "$cuda_zip") >= 2147483648 )); then
            (
              cd "$(dirname "$cuda_zip")"
              sha256sum "$(basename "$cuda_zip")"
            ) > release-assets/CUDA-RECONSTRUCTED-SHA256.txt
            split -b 1900M -d -a 2 "$cuda_zip" "$cuda_zip.part-"
            rm "$cuda_zip"
            cat > release-assets/CUDA-REASSEMBLY.txt <<'EOF'
          GitHub Release assets must each be under 2 GiB, so the Windows CUDA
          zip is published in numbered parts. Reassemble it in PowerShell:

          $parts = Get-ChildItem 'AETV-windows-x64-cuda.zip.part-*' | Sort-Object Name
          $output = [IO.File]::Create('AETV-windows-x64-cuda.zip')
          try {
            foreach ($part in $parts) {
              $input = [IO.File]::OpenRead($part.FullName)
              try { $input.CopyTo($output) } finally { $input.Dispose() }
            }
          } finally { $output.Dispose() }

          Then verify the reconstructed zip against
          CUDA-RECONSTRUCTED-SHA256.txt. SHA256SUMS.txt covers every file as
          downloaded, including each numbered part.
          EOF
          fi
          (
            cd release-assets
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > release-assets/SHA256SUMS.txt

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes --verify-tag
