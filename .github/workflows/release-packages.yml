name: Release packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux CPU
            os: ubuntu-latest
            artifact: aetv-linux-x64-cpu
            output: dist/linux-cpu/AETV-linux-x64-cpu.tar.gz
            command: ./scripts/build_linux.sh
          - name: Windows CPU
            os: windows-latest
            artifact: aetv-windows-x64-cpu
            output: dist/windows-cpu/AETV-windows-x64-cpu.zip
            command: ./scripts/build_windows.ps1 -Runtime cpu
          - name: Windows CUDA
            os: windows-latest
            artifact: aetv-windows-x64-cuda
            output: dist/windows-cuda/AETV-windows-x64-cuda.zip
            command: ./scripts/build_windows.ps1 -Runtime cuda

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Linux GUI runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Build and smoke-test portable package
        shell: pwsh
        if: runner.os == 'Windows'
        run: ${{ matrix.command }}

      - name: Build and smoke-test portable package
        shell: bash
        if: runner.os == 'Linux'
        run: ${{ matrix.command }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
