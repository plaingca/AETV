name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux CPU
            os: ubuntu-latest
            artifact: aetv-linux-x64-cpu
            output: dist/linux-cpu/AETV-linux-x64-cpu.tar.gz
            command: ./scripts/build_linux.sh
          - name: Windows CPU
            os: windows-latest
            artifact: aetv-windows-x64-cpu
            output: dist/windows-cpu/AETV-windows-x64-cpu.zip
            command: ./scripts/build_windows.ps1 -Runtime cpu
          - name: Windows GPU
            os: windows-latest
            artifact: aetv-windows-x64-gpu
            output: dist/windows-gpu/AETV-windows-x64-gpu.zip
            command: ./scripts/build_windows.ps1 -Runtime gpu

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Linux GUI runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libhamlib-utils libhamlib4t64

      - name: Build and smoke-test portable package
        shell: pwsh
        if: runner.os == 'Windows'
        run: ${{ matrix.command }}

      - name: Build and smoke-test portable package
        shell: bash
        if: runner.os == 'Linux'
        run: ${{ matrix.command }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > release-assets/SHA256SUMS.txt

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes --verify-tag
