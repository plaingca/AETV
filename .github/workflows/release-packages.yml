name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to rebuild and publish; leave empty for artifacts only
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

concurrency:
  group: release-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux CPU
            os: ubuntu-22.04
            artifact: aetv-linux-x64-cpu
            output: dist/linux-cpu/AETV-linux-x64-cpu.*
            command: ./scripts/build_linux.sh
          - name: Linux GPU
            os: ubuntu-22.04
            artifact: aetv-linux-x64-gpu
            output: dist/linux-gpu/AETV-linux-x64-gpu.*
            command: AETV_RUNTIME=gpu ./scripts/build_linux.sh
          - name: Windows CPU
            os: windows-latest
            artifact: aetv-windows-x64-cpu
            output: dist/windows-cpu/AETV-windows-x64-cpu.zip
            command: ./scripts/build_windows.ps1 -Runtime cpu
          - name: Windows GPU
            os: windows-latest
            artifact: aetv-windows-x64-gpu
            output: dist/windows-gpu/AETV-windows-x64-gpu.zip
            command: ./scripts/build_windows.ps1 -Runtime gpu

    steps:
      - name: Validate release target
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Expected an existing version tag such as v0.1.26" >&2
            exit 1
          }

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Constrain packaged runtime to the source lockfile
        shell: bash
        run: |
          set -euo pipefail
          uv export --locked --extra gui --no-dev --no-emit-project --no-hashes \
            --format requirements-txt \
            --output-file "$RUNNER_TEMP/aetv-runtime-constraints.txt" > /dev/null
          echo "UV_CONSTRAINT=$RUNNER_TEMP/aetv-runtime-constraints.txt" >> "$GITHUB_ENV"

      - name: Install Linux GUI runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libhamlib-utils libiio-dev rtl-sdr cmake libusb-1.0-0-dev

      - name: Install appimagetool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" \
            | sha256sum --check
          chmod 755 "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"

      - name: Build and smoke-test portable package
        shell: pwsh
        if: runner.os == 'Windows'
        run: ${{ matrix.command }}

      - name: Build and smoke-test portable package
        shell: bash
        if: runner.os == 'Linux'
        run: ${{ matrix.command }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > release-assets/SHA256SUMS.txt

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            extra=()
            if [[ "$RELEASE_TAG" == *rc* || "$RELEASE_TAG" == *-* ]]; then extra+=(--prerelease --latest=false); fi
            gh release create "$RELEASE_TAG" "${assets[@]}" --generate-notes --verify-tag "${extra[@]}"
          fi
